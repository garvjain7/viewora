[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viewora-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic",
  "argon2-cffi",
  "fastapi",
  "procrastinate",
  "psycopg[binary,pool]",
  "pydantic>=2",
  "sqlalchemy>=2,<3",
  "structlog",
  "uvicorn[standard]",
]

[dependency-groups]
dev = [
  "pyright",
  "pytest",
  "ruff",
  "testcontainers[postgres]",
]

[tool.setuptools.packages.find]
where = ["src"]
